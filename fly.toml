# fly.toml app configuration file generated for listing-lfwjrg on 2026-06-30T21:32:31Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'listing-lfwjrg'
primary_region = 'sjc'

[build]

[env]
  EBAY_ENV = 'sandbox'
  PORT = '8080'
  DATA_DIR = '/data'
  # Cache the rembg U^2-Net model on the persistent volume so cold starts
  # don't re-download the ~170MB model every time.
  U2NET_HOME = '/data/models'

# Sessions (uploaded/optimized photos) and exports must survive machine
# restarts and deploys: eBay fetches the listing's image URLs from /media/...
# at publish time, and the machine rootfs is ephemeral. Dead image URLs make
# eBay's Inventory API fail with the opaque 25001 'system error'.
[mounts]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  # 1GB: background removal loads onnxruntime + the U^2-Net model, which OOMs
  # a 512MB machine.
  memory = '1gb'
