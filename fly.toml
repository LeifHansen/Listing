# fly.toml app configuration file generated for listing-lfwjrg on 2026-06-30T21:32:31Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'listing-lfwjrg'
primary_region = 'sjc'

[build]

[env]
  # Production eBay keyset lives in `fly secrets` — keep the app pointed at the
  # production API. (A secret named EBAY_ENV would override this either way.)
  EBAY_ENV = 'production'
  PORT = '8080'
  # The app answers on app.thryftshop.com as well as listing-lfwjrg.fly.dev
  # (GoDaddy CNAME + the certificate the deploy workflow registers). Only OAuth
  # cares which one a request arrived on: eBay resolves EBAY_RUNAME to a single
  # accepted URL, and Etsy/Depop match redirect_uri exactly, so every callback
  # comes back to ONE origin no matter where the seller started.
  #
  # OAUTH_ORIGIN is that origin. It stays the .fly.dev host because that is
  # what is registered in the marketplace consoles today — so nothing has to be
  # re-registered for app.thryftshop.com to work, and a seller who starts a
  # connect there is bounced here for the handshake and returned to
  # app.thryftshop.com at the end. Change it only in step with the accepted URL
  # on developer.ebay.com and the Etsy/Depop callback settings.
  OAUTH_ORIGIN = 'https://listing-lfwjrg.fly.dev'
  # Every origin the app is served on, and the only ones a connect flow will
  # return a seller to. The Host header is client-controlled, so this list is
  # what stops the return trip being an open redirect. Add a hostname here in
  # the same commit that gives it a certificate.
  APP_ORIGINS = 'https://app.thryftshop.com,https://listing-lfwjrg.fly.dev'
  DATA_DIR = '/data'
  # WHICH MARKETPLACES THIS DEPLOY OFFERS. The launch is eBay ALONE. Etsy and
  # Depop are built, mapped and tested, and switched off here: with the
  # variable unset the code's default (config.marketplaces_enabled) offers
  # eBay and nothing else, so neither appears in /api/marketplaces, the
  # Settings cards, the publish chips, the editor panels or the crosspost —
  # and every /api/etsy/* and /api/depop/* route answers 404.
  #
  # To bring Etsy back, uncomment the two lines below ('all' adds Depop).
  # Etsy needs, as `fly secrets`, ETSY_CLIENT_ID, ETSY_SHARED_SECRET (Etsy
  # refuses every request without it since 2026-02-09), ETSY_REDIRECT_URI
  # (OAUTH_ORIGIN + /api/etsy/callback, registered on the Etsy app exactly)
  # and ETSY_OWNER_EMAILS — the beta roster. Missing any of the first three,
  # the Etsy card says which; missing the roster, the gate is inert and every
  # seller reaches Etsy's own refusal page (config_warnings warns, and the
  # Etsy card shows a caution plus a confirm — but the roster is the fix).
  # MARKETPLACES_ENABLED = 'ebay,etsy'
  # Etsy approved this app on 2026-08-31 — at the PERSONAL tier, which seats a
  # handful of shops (Etsy documents 4), not the unlimited Commercial Access
  # above it. Not a secret, so it lives here rather than in `fly secrets`. It
  # decides which wait a gated seller is told about; WHO gets through is still
  # ETSY_OWNER_EMAILS. Set 'commercial' the day Etsy grants it. Inert while
  # Etsy is withheld above; left in place for the day it comes back.
  # ETSY_ACCESS_TIER = 'personal'
  # Background removal is Photoroom's API (services/cutout_api), on the app's
  # one Photoroom account. PHOTOROOM_API_KEY in `fly secrets` is the whole
  # switch: without it the feature is unavailable and the uploader does not
  # offer it. Each seller then turns it on for themselves in Settings. A key
  # starting `sandbox_` watermarks every cutout -- never in production.
  # /api/ready names the engine and whether it has a key. The per-seller
  # monthly cap is BG_REMOVAL_MONTHLY_LIMIT (default 1000 photos):
  #   BG_REMOVAL_MONTHLY_LIMIT = '1000'
  # How many items of one bulk batch are drafted at the same time. Each one is
  # five to nine Anthropic calls and a handful of eBay lookups, and the machine
  # spends nearly all of that waiting on somebody else's server -- so one at a
  # time left the box idle for most of a batch.
  #
  # Three, and the ceiling is this machine rather than any API: each worker
  # holds a listing's photos as base64 for its vision calls and crops the
  # full-size originals for the tag close-ups. Here rather than in code so raising
  # it -- or dropping to 1, which is the off switch and the old behaviour
  # exactly -- is a one-line commit somebody can review.
  BULK_DRAFT_WORKERS = '3'

# Sessions (uploaded/optimized photos) and exports must survive machine
# restarts and deploys: eBay fetches the listing's image URLs from /media/...
# at publish time, and the machine rootfs is ephemeral. Dead image URLs make
# eBay's Inventory API fail with the opaque 25001 'system error'.
[mounts]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine always warm: auto-stop would let it go cold, and a load
  # during the wake window renders a "naked" (uncached CSS fails) page. Small
  # always-on cost buys a site that's instant and always fully styled.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  # Without this Fly only knows something accepts TCP on 8080 — which a
  # wedged event loop still does, and which a deploy that booted with a
  # broken config still does. This is a LIVENESS check: it asks whether the
  # app can still serve a request, and deliberately passes while Postgres or
  # R2 are down. Tying it to those would have Fly restart the machine over an
  # outage it cannot fix, turning someone else's blip into a restart loop.
  # Their state is on /api/ready (public) and /api/admin/diagnostics (behind
  # the admin token); /api/health carries liveness and the UI's flags only.
  # grace_period covers the boot: the R2 probe and the database warm-up.
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/api/health"

[[vm]]
  # 4GB was for the on-server background-removal model (onnxruntime + the
  # 176MB isnet-general-use), which is gone: Photoroom does the cutting now.
  # What is left is the API process, Pillow on one 1600px photo at a time, and
  # BULK_DRAFT_WORKERS listings' photos held as base64 -- well inside 2GB.
  # Watch the memory graph after the first deploy at this size; going back is
  # this one line.
  size = 'shared-cpu-2x'
  memory = '2gb'
