# fly.toml app configuration file generated for listing-lfwjrg on 2026-06-30T21:32:31Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'listing-lfwjrg'
primary_region = 'sjc'

[build]

[env]
  # Production eBay keyset lives in `fly secrets` — keep the app pointed at the
  # production API. (A secret named EBAY_ENV would override this either way.)
  EBAY_ENV = 'production'
  PORT = '8080'
  DATA_DIR = '/data'
  # Background removal defaults to the FREE on-server model (BG_ENGINE unset =
  # auto: Pixian if its keys are ever added as secrets, else local). The paid
  # Photoroom/Adobe engines only run if a BG_ENGINE secret explicitly selects
  # them. isnet-general-use is the best-quality local model — it needs the 4GB
  # VM below — and is baked into the image (see Dockerfile), so no runtime
  # download and no volume dependency.
  REMBG_MODEL = 'isnet-general-use'
  # Size of the copy we hand the model. Match it to the model's own input
  # (isnet normalizes to 1024x1024 internally, whatever it is given) — feeding
  # it less just means it upscales our downscale, which costs the same and
  # produces a worse matte. This knob is NOT an inference-cost dial; measured
  # on 2 pinned cores, 640 and 1024 run within 2% of each other. What it does
  # buy is a cheaper refinement pass and a smaller working copy, which is why
  # a memory-constrained box may still want it lower.
  REMBG_MAX_SIDE = '1024'
  # Photos in flight per batch with the local engine. Inference stays
  # single-flight (in-process lock); this overlaps the mask/crop/encode work
  # around it. 2, not 3: contention is what actually costs time here. Measured
  # on 2 pinned cores, one inference takes 0.32s with nothing else running,
  # 0.72s against one competing worker and 0.83s against two — so a third
  # worker had no core to run on and just slowed the two doing the work.
  PHOTO_LOCAL_WORKERS = '2'

# Sessions (uploaded/optimized photos) and exports must survive machine
# restarts and deploys: eBay fetches the listing's image URLs from /media/...
# at publish time, and the machine rootfs is ephemeral. Dead image URLs make
# eBay's Inventory API fail with the opaque 25001 'system error'.
[mounts]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine always warm: auto-stop would let it go cold, and a load
  # during the wake window renders a "naked" (uncached CSS fails) page. Small
  # always-on cost buys a site that's instant and always fully styled.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  # Without this Fly only knows something accepts TCP on 8080 — which a
  # wedged event loop still does, and which a deploy that booted with a
  # broken config still does. This is a LIVENESS check: it asks whether the
  # app can still serve a request, and deliberately passes while Postgres or
  # R2 are down. Tying it to those would have Fly restart the machine over an
  # outage it cannot fix, turning someone else's blip into a restart loop —
  # /api/health reports their state in its body for humans and the UI banner.
  # grace_period covers the model warm-up thread started at boot.
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/api/health"

[[vm]]
  # Background removal loads onnxruntime + rembg (scipy/numba). The
  # isnet-general-use model ([env] above) needs 4GB — on 2GB it OOM-kills the
  # box and only the light u2netp runs reliably. 4GB is a flat ~$10/mo over
  # 2GB, versus the per-image price of a paid cutout API.
  size = 'shared-cpu-2x'
  memory = '4gb'
