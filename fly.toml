# fly.toml app configuration file generated for listing-lfwjrg on 2026-06-30T21:32:31Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'listing-lfwjrg'
primary_region = 'sjc'

[build]

[env]
  # Production eBay keyset lives in `fly secrets` — keep the app pointed at the
  # production API. (A secret named EBAY_ENV would override this either way.)
  EBAY_ENV = 'production'
  PORT = '8080'
  DATA_DIR = '/data'
  # Background removal is a Photoroom API call — PHOTOROOM_API_KEY lives in
  # `fly secrets`; no local model in the image.

# Sessions (uploaded/optimized photos) and exports must survive machine
# restarts and deploys: eBay fetches the listing's image URLs from /media/...
# at publish time, and the machine rootfs is ephemeral. Dead image URLs make
# eBay's Inventory API fail with the opaque 25001 'system error'.
[mounts]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine always warm: auto-stop would let it go cold, and a load
  # during the wake window renders a "naked" (uncached CSS fails) page. Small
  # always-on cost buys a site that's instant and always fully styled.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  # Bulk photo optimization runs several full-res Pillow passes concurrently;
  # 2GB + 2 vCPUs gives comfortable headroom now that background removal is
  # API-side (Photoroom) instead of an in-process model.
  size = 'shared-cpu-2x'
  memory = '2gb'
