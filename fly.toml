# fly.toml app configuration file generated for listing-lfwjrg on 2026-06-30T21:32:31Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'listing-lfwjrg'
primary_region = 'sjc'

[build]

[env]
  EBAY_ENV = 'sandbox'
  PORT = '8080'
  DATA_DIR = '/data'
  # The background-removal model is baked into the image (see Dockerfile), so
  # no runtime download and no volume dependency for it.

# Sessions (uploaded/optimized photos) and exports must survive machine
# restarts and deploys: eBay fetches the listing's image URLs from /media/...
# at publish time, and the machine rootfs is ephemeral. Dead image URLs make
# eBay's Inventory API fail with the opaque 25001 'system error'.
[mounts]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine always warm: auto-stop would let it go cold, and a load
  # during the wake window renders a "naked" (uncached CSS fails) page and
  # makes background removal pay a ~60s JIT cost. Small always-on cost buys a
  # site that's instant and always fully styled.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  # Background removal loads onnxruntime + rembg (scipy/numba/opencv). 1GB
  # thrashes and the request hangs; 2GB + 2 vCPUs runs it in a few seconds.
  # auto_stop keeps it billed only while actually in use.
  size = 'shared-cpu-2x'
  memory = '2gb'
