name: Deploy to Fly.io

# Auto-deploy: every push to main (i.e. every merged PR) deploys the app to
# Fly. Can also be run manually from the Actions tab on any branch.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never run two deploys at once; a newer push supersedes an in-progress one.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
