name: Deploy to Fly.io

# Auto-deploy: every push to the default branch (i.e. every merged PR) deploys
# the app to Fly. Can also be run manually from the Actions tab.
#
# `main` is the default branch again as of 2026-08-20. It had been carrying a
# separate, unrelated history (its own root commit, no ancestor in common with
# the branch the app actually shipped from); that lineage is preserved at the
# branch archive/legacy-main, and `main` was then repointed at the live head.
# The transitional second trigger for the old trunk name is gone with it.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never run two deploys at once; a newer push supersedes an in-progress one.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  # THE gate, and the same one ci.yml runs on a pull request. ci.yml triggers
  # only on `pull_request`, so a direct push to the deploy branch (or a manual
  # dispatch) previously shipped with no check having run at all.
  #
  # This used to be a local copy of the lint + unit job ALONE, which meant
  # production was gated on the fast unit tests and nothing else: the
  # cutout-safety suite (does the background remover eat the product), the
  # frontend build (the only thing that type-checks the JSX) and the smoke
  # test (the only thing that catches a screen a seller cannot open) never
  # gated a deploy. Calling the shared workflow runs all four, on this exact
  # commit, and removes the copy that this file's own comment already warned
  # had to be kept in sync by hand.
  gates:
    name: Gates
    uses: ./.github/workflows/gates.yml

  deploy:
    name: Deploy app
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned, not @master: this step runs in the job holding
      # FLY_API_TOKEN, so following a moving branch means whatever
      # superfly pushed most recently gets that token. v1.5 is the
      # current release tag; a commit sha would be stronger still and is
      # tracked in REMEDIATION_STATUS.md with the other actions.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      # --no-cache and an immediate replace, because a deploy that reports
      # success while production keeps serving the previous image is the
      # failure this pipeline actually had: on 2026-08-26 six consecutive
      # deploys built the right code (COPY backend ran fresh, the frontend
      # emitted a new bundle hash) and the app went on answering with a build
      # from days earlier. A slower deploy is worth far less than a deploy you
      # cannot trust.
      # Before shipping, not after. The account-deletion endpoint answers
      # eBay's validation challenge with a hash of EBAY_VERIFICATION_TOKEN and
      # 503s without it -- and eBay disables a Production keyset's
      # notification subscription when that endpoint keeps failing. A deploy
      # that silently ships it unset is how the subscription goes away
      # quietly, so this refuses to deploy instead.
      #
      # `secrets list` prints NAMES, never values, so nothing sensitive
      # reaches the log. Tolerant about the key's casing because flyctl has
      # used both, and a check that crashes on an output change would block
      # every deploy for the wrong reason. ADMIN_TOKEN is only a warning:
      # unset means /api/admin/diagnostics stays closed, which is its
      # deliberate fail-closed default rather than a broken deploy.
      - name: Required secrets are set
        run: |
          flyctl secrets list --json > /tmp/secrets.json
          python3 - <<'CHECK'
          import json, sys
          rows = json.load(open("/tmp/secrets.json"))
          names = {str(r.get("Name") or r.get("name") or "") for r in rows}
          print("secrets present:", " ".join(sorted(n for n in names if n)))
          if "EBAY_VERIFICATION_TOKEN" not in names:
              print("::error::EBAY_VERIFICATION_TOKEN is not set on this app. "
                    "eBay's account-deletion challenge answers 503 without it, and "
                    "eBay disables the subscription when that keeps failing. Set it "
                    "with `flyctl secrets set EBAY_VERIFICATION_TOKEN=...`, using the "
                    "SAME value registered on developer.ebay.com under Alerts & "
                    "Notifications.")
              sys.exit(1)
          print("OK: EBAY_VERIFICATION_TOKEN is set")
          if "ADMIN_TOKEN" not in names:
              print("::warning::ADMIN_TOKEN is not set, so /api/admin/diagnostics "
                    "stays closed (by design). The deletion backlog and "
                    "owed-refunds counters cannot be read until it is.")
          else:
              print("OK: ADMIN_TOKEN is set")
          CHECK
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly
        run: |
          flyctl deploy --remote-only --no-cache \
            --strategy immediate \
            --build-arg GIT_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # The gate. /api/health reports the commit its image was built from, so
      # "did this deploy actually reach production" is answerable instead of
      # assumed. Without it the pipeline is free to report success forever
      # while sellers use week-old code -- which is exactly what happened.
      - name: Verify production is running this commit
        run: |
          want='${{ github.sha }}'
          for i in $(seq 1 20); do
            got=$(curl -sS -m 15 https://listing-lfwjrg.fly.dev/api/health \
                  | python3 -c 'import json,sys;print((json.load(sys.stdin).get("build") or "").strip())' \
                  2>/dev/null || echo '')
            echo "attempt $i: running=${got:-<none>} want=$want"
            [ "$got" = "$want" ] && echo "OK: production is running $want" && exit 0
            sleep 15
          done
          echo "::error::Deploy reported success but production is NOT running $want (last saw '${got:-none}')."
          echo "::error::The image was built and pushed; the machine is serving something else."
          exit 1
