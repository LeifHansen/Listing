name: Deploy to Fly.io

# Auto-deploy: every push to the default branch (i.e. every merged PR) deploys
# the app to Fly. Can also be run manually from the Actions tab.
#
# Both names are listed during the move to `main`. The repo carries two
# unrelated histories: the old `main` (archived at the branch
# archive/legacy-main) and the trunk everything actually shipped from,
# claude/ebay-listing-generator-se7lao. `main` now points at that trunk, so
# either name deploying the same commit is correct — and listing both means
# the deploy cannot silently stop working at the moment the default branch is
# switched over. Drop the long name once the switch is done and it is deleted.
on:
  push:
    branches:
      - main
      - claude/ebay-listing-generator-se7lao
  workflow_dispatch:

# Never run two deploys at once; a newer push supersedes an in-progress one.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  # The same lint + unit tests CI runs on pull requests, repeated here as a
  # deploy gate. ci.yml only triggers on `pull_request`, so a direct push to
  # the deploy branch (or a manual dispatch) previously shipped to production
  # with no check having run at all.
  checks:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install ruff pytest python-dotenv pydantic boto3 SQLAlchemy bcrypt PyJWT fastapi httpx
      - name: Ruff
        run: ruff check backend
      - name: Tests
        run: pytest backend/tests -q

  deploy:
    name: Deploy app
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
