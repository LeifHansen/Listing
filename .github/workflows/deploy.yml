name: Deploy to Fly.io

# Auto-deploy: every push to the default branch (i.e. every merged PR) deploys
# the app to Fly. Can also be run manually from the Actions tab.
#
# `main` is the default branch again as of 2026-08-20. It had been carrying a
# separate, unrelated history (its own root commit, no ancestor in common with
# the branch the app actually shipped from); that lineage is preserved at the
# branch archive/legacy-main, and `main` was then repointed at the live head.
# The transitional second trigger for the old trunk name is gone with it.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never run two deploys at once; a newer push supersedes an in-progress one.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  # The same lint + unit tests CI runs on pull requests, repeated here as a
  # deploy gate. ci.yml only triggers on `pull_request`, so a direct push to
  # the deploy branch (or a manual dispatch) previously shipped to production
  # with no check having run at all.
  checks:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install ruff pytest python-dotenv pydantic boto3 SQLAlchemy bcrypt PyJWT fastapi httpx
      - name: Ruff
        run: ruff check backend
      - name: Tests
        run: pytest backend/tests -q

  deploy:
    name: Deploy app
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to Fly
        run: flyctl deploy --remote-only --build-arg GIT_SHA=${{ github.sha }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
