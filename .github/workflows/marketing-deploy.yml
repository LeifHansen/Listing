name: Deploy marketing site

# Ships the marketing site to its own Fly app. Entirely separate from
# deploy.yml: this app has no volume, no database and no secrets, and nothing
# here can affect the product's release.
#
# Path-filtered, and the filter includes the app's token file because the site
# imports its brand from it (marketing/src/styles/global.css) — a change to
# those tokens genuinely restyles this site and should redeploy it.

on:
  push:
    branches: [main]
    paths:
      - 'marketing/**'
      - 'frontend/src/styles/tokens.css'
      - '.github/workflows/marketing-deploy.yml'
  workflow_dispatch:

concurrency:
  group: marketing-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: marketing/package-lock.json

      - name: Install
        run: npm ci
        working-directory: marketing

      # The build happens HERE, not inside the Docker image. The site imports
      # its brand tokens from frontend/src/styles/tokens.css, which is outside
      # the image's build context — so the image serves a dist/ that this step
      # produced and the next step verified.
      - name: Build
        run: npm run build
        working-directory: marketing
        env:
          SITE_URL: ${{ vars.MARKETING_SITE_URL }}
          PUBLIC_SIGNUP_ENDPOINT: ${{ vars.MARKETING_SIGNUP_ENDPOINT }}

      - name: Link + SEO check
        run: npm run links
        working-directory: marketing

      # Pinned to a commit SHA, not @master: this job holds FLY_API_TOKEN, so
      # following a moving branch hands that token to whatever superfly pushed
      # most recently. Same pin deploy.yml uses.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      # First-run bootstrap. The app and its IPs have to exist before a deploy
      # can land, and doing it here rather than by hand means the first deploy
      # works from a clean account with nothing typed into a terminal. Every
      # command is safe to re-run: create is skipped when the app is already
      # there, and IPs are only allocated when there are none.
      - name: Create the Fly app if it does not exist
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          app=$(grep -m1 "^app " fly.toml | cut -d"'" -f2)
          echo "app: $app"
          if flyctl status -a "$app" >/dev/null 2>&1; then
            echo "already exists"
          else
            echo "not found — creating"
            # A deploy token scoped to another app cannot create this one. If
            # that is the case, say so precisely instead of failing on the
            # deploy three steps later with a less obvious error.
            if ! flyctl apps create "$app" --org personal 2>&1 | tee /tmp/create.log; then
              if grep -qi "unauthor\|permission\|not allowed\|token" /tmp/create.log; then
                echo "::error::FLY_API_TOKEN cannot create apps — it is probably a deploy token scoped to the existing app. Create an org-scoped token (fly tokens create org) and update the FLY_API_TOKEN secret, or run 'fly apps create $app' once by hand."
              fi
              exit 1
            fi
          fi
        working-directory: marketing

      - name: Give it IPs if it has none
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          app=$(grep -m1 "^app " fly.toml | cut -d"'" -f2)
          ips=$(flyctl ips list -a "$app" 2>/dev/null || true)
          echo "$ips"
          # A shared v4 is free and is all an HTTPS site needs; a dedicated one
          # is only required for non-HTTP services.
          echo "$ips" | grep -q "v4" || flyctl ips allocate-v4 --shared -a "$app"
          echo "$ips" | grep -q "v6" || flyctl ips allocate-v6 -a "$app"
        working-directory: marketing

      - name: Deploy to Fly
        run: |
          flyctl deploy --config fly.toml --remote-only \
            --build-arg GIT_SHA="$GITHUB_SHA"
        working-directory: marketing
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # The DNS records cannot be written until these values exist, so print
      # them where they can be read rather than telling someone to go and run
      # a command to find them.
      - name: The DNS records to create
        if: always()
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          app=$(grep -m1 "^app " fly.toml | cut -d"'" -f2)
          v4=$(flyctl ips list -a "$app" 2>/dev/null | awk '$1=="v4"{print $2; exit}')
          v6=$(flyctl ips list -a "$app" 2>/dev/null | awk '$1=="v6"{print $2; exit}')
          {
            echo "## DNS records for GoDaddy"
            echo
            echo "| Type | Name | Value |"
            echo "|---|---|---|"
            echo "| A | @ | \`${v4:-not allocated}\` |"
            echo "| AAAA | @ | \`${v6:-not allocated}\` |"
            echo "| CNAME | www | \`$app.fly.dev\` |"
            echo "| CNAME | app | \`listing-lfwjrg.fly.dev\` |"
            echo
            echo "Then, once those resolve:"
            echo '```'
            echo "flyctl certs add thryftshop.com -a $app"
            echo "flyctl certs add www.thryftshop.com -a $app"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "v4=${v4:-none} v6=${v6:-none}"
        working-directory: marketing

      # A deploy can report success while the previous image keeps serving —
      # that exact failure is why the app's pipeline verifies itself, and the
      # reasoning does not stop applying because this app is smaller. The image
      # stamps the commit at /.build; poll until the live site reports the one
      # we just shipped.
      - name: Verify the site is running this commit
        shell: bash
        run: |
          host="${{ vars.MARKETING_SITE_URL || 'https://thryft-marketing.fly.dev' }}"
          for i in $(seq 1 30); do
            live=$(curl -fsS --max-time 10 "$host/.build" 2>/dev/null | tr -d '[:space:]' || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "OK: $host is serving $GITHUB_SHA"
              exit 0
            fi
            echo "attempt $i: live='$live' want='$GITHUB_SHA'"
            sleep 5
          done
          echo "::error::$host never reported $GITHUB_SHA — the deploy said it succeeded but the site is serving something else"
          exit 1
