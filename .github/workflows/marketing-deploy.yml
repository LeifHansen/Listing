name: Deploy marketing site

# Publishes the static build to Cloudflare Pages. Runs only for changes that
# can actually affect the site, and is entirely independent of deploy.yml —
# shipping the app and shipping the marketing site are separate events.
#
# Deploys through `npx wrangler` rather than a third-party action, so the only
# code that sees CLOUDFLARE_API_TOKEN is Cloudflare's own published CLI.

on:
  push:
    branches: [main]
    paths:
      - 'marketing/**'
      - 'frontend/src/styles/tokens.css'
      - '.github/workflows/marketing-deploy.yml'
  workflow_dispatch:

concurrency:
  group: marketing-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: marketing/package-lock.json

      - name: Install
        run: npm ci
        working-directory: marketing

      # SITE_URL is what every canonical URL, sitemap entry and OG image URL is
      # built from. Set it as a repository variable once the domain exists; the
      # default in astro.config.mjs is used until then.
      - name: Build
        run: npm run build
        working-directory: marketing
        env:
          SITE_URL: ${{ vars.MARKETING_SITE_URL }}
          PUBLIC_SIGNUP_ENDPOINT: ${{ vars.MARKETING_SIGNUP_ENDPOINT }}

      - name: Link + SEO check
        run: npm run links
        working-directory: marketing

      - name: Publish to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy dist --project-name "$PROJECT" --branch main
        working-directory: marketing
        env:
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'thryft-marketing' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
