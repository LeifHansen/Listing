name: Deploy marketing site

# Ships the marketing site to its own Fly app. Entirely separate from
# deploy.yml: this app has no volume, no database and no secrets, and nothing
# here can affect the product's release.
#
# Path-filtered, and the filter includes the app's token file because the site
# imports its brand from it (marketing/src/styles/global.css) — a change to
# those tokens genuinely restyles this site and should redeploy it.

on:
  push:
    branches: [main]
    paths:
      - 'marketing/**'
      - 'frontend/src/styles/tokens.css'
      - '.github/workflows/marketing-deploy.yml'
  workflow_dispatch:

concurrency:
  group: marketing-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: marketing/package-lock.json

      - name: Install
        run: npm ci
        working-directory: marketing

      # The build happens HERE, not inside the Docker image. The site imports
      # its brand tokens from frontend/src/styles/tokens.css, which is outside
      # the image's build context — so the image serves a dist/ that this step
      # produced and the next step verified.
      - name: Build
        run: npm run build
        working-directory: marketing
        env:
          SITE_URL: ${{ vars.MARKETING_SITE_URL }}
          PUBLIC_SIGNUP_ENDPOINT: ${{ vars.MARKETING_SIGNUP_ENDPOINT }}

      - name: Link + SEO check
        run: npm run links
        working-directory: marketing

      # Pinned to a commit SHA, not @master: this job holds FLY_API_TOKEN, so
      # following a moving branch hands that token to whatever superfly pushed
      # most recently. Same pin deploy.yml uses.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      - name: Deploy to Fly
        run: |
          flyctl deploy --config fly.toml --remote-only \
            --build-arg GIT_SHA="$GITHUB_SHA"
        working-directory: marketing
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # A deploy can report success while the previous image keeps serving —
      # that exact failure is why the app's pipeline verifies itself, and the
      # reasoning does not stop applying because this app is smaller. The image
      # stamps the commit at /.build; poll until the live site reports the one
      # we just shipped.
      - name: Verify the site is running this commit
        shell: bash
        run: |
          host="${{ vars.MARKETING_SITE_URL || 'https://thryft-marketing.fly.dev' }}"
          for i in $(seq 1 30); do
            live=$(curl -fsS --max-time 10 "$host/.build" 2>/dev/null | tr -d '[:space:]' || true)
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "OK: $host is serving $GITHUB_SHA"
              exit 0
            fi
            echo "attempt $i: live='$live' want='$GITHUB_SHA'"
            sleep 5
          done
          echo "::error::$host never reported $GITHUB_SHA — the deploy said it succeeded but the site is serving something else"
          exit 1
