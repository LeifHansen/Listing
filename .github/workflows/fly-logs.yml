name: Fetch Fly logs
# Ops helper: push to this branch (or run manually) to dump recent production
# logs + live-site ground truth into the Actions run output for debugging.
on:
  push:
    branches:
      - ops/fetch-logs
  workflow_dispatch:

# Share the deploy's concurrency group. This job SSHes into the machine and
# reads the live site, so letting it interleave with a deploy of the same app
# reads half-migrated state and reports it as fact. A diagnostic that races the
# thing it is diagnosing is worse than no diagnostic.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  logs:
    name: Dump app status, live-site check, logs
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Machines + releases
        run: |
          flyctl status -a listing-lfwjrg || true
          echo "--- releases ---"
          flyctl releases -a listing-lfwjrg | head -8 || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # A "destroy the remote builder" step used to live here, on the theory
      # that a poisoned Docker layer cache was what kept re-publishing the old
      # UI. It is REMOVED, for two reasons.
      #
      # It is no longer the remedy: the deploy workflow passes --no-cache now
      # (#185), so no layer from a previous build can survive into a new one
      # whether or not the builder is fresh.
      #
      # And it was dangerous here. This is a LOG-READING job — something you
      # reach for precisely when production is misbehaving, which is also when
      # a deploy is most likely to be in flight. Destroying the builder out
      # from under a running `fly deploy` kills that deploy. A diagnostic must
      # never be able to break the thing it is diagnosing.
      - name: Secret names (values are never shown)
        run: flyctl secrets list -a listing-lfwjrg || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Volume size + disk usage (the /data volume)
        run: |
          flyctl volumes list -a listing-lfwjrg || true
          echo "--- df on the machine ---"
          flyctl ssh console -a listing-lfwjrg -C "df -h /data" || true
          echo "--- biggest consumers under /data ---"
          flyctl ssh console -a listing-lfwjrg -C "du -sh /data/sessions /data/exports" || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Live site check (hits the public URL from the runner)
        run: |
          for i in 1 2 3 4; do
            echo "=== attempt $i ==="
            curl -sS -D - -o /tmp/index.html https://listing-lfwjrg.fly.dev/ | grep -i -E "fly-machine|http/|cache" || true
            grep -o "<title>[^<]*</title>" /tmp/index.html || true
            grep -o "assets/index-[A-Za-z0-9_-]*\.js" /tmp/index.html | head -1 || true
          done
          echo "=== health ==="
          curl -sS https://listing-lfwjrg.fly.dev/api/health || true
      # Today's incident: publishes rejected with eBay's error-240 catch-all
      # after an account reconnect, old account's listings still showing. The
      # lines that decide the fix: which Trading call was rejected (AddItem =
      # real account hold; ReviseItem = stale item id from the old account),
      # and whether the connect callback detected the switch and stamped
      # anything.
      - name: eBay account-switch and publish-rejection trail
        run: |
          flyctl logs -a listing-lfwjrg --no-tail \
            | grep -iE 'ebay connect|account switch|labelled|release-foreign|stamp|trading: .* rejected|code=240|publish blocked|payments program' \
            | tail -80 || echo "(no matching lines in the retained window)"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Photos are saving with their original (dark) background instead of the
      # white cutout. Every success path composites onto a white canvas, so a
      # dark result means the cutout never got applied and the original was
      # kept — and the app keeps the original silently, on several different
      # paths. This prints which one actually fires: the inference queue giving
      # up (CutoutBusy), the subject-survived guard rejecting the matte, a
      # thrown error, or inference simply running long enough that the client
      # hung up first.
      - name: Background-removal trail (why photos keep their background)
        run: |
          flyctl logs -a listing-lfwjrg --no-tail \
            | grep -iE 'bg-removal|cutout|CutoutBusy|matte|inference took|subject|remove background|rembg|onnx' \
            | tail -80 || echo "(no bg-removal lines in the retained window)"
          echo "--- how the model is configured on the running machine ---"
          curl -sS https://listing-lfwjrg.fly.dev/api/ready | tr ',' '\n' \
            | grep -iE 'model|loaded|busy|inference|engine' || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Recent logs
        run: flyctl logs -a listing-lfwjrg --no-tail | tail -120
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # The raw tail above is dominated by eBay's account-deletion pings; this
      # pass surfaces the actual problems across the whole retained window.
      - name: Errors and warnings only (full retained window)
        run: |
          flyctl logs -a listing-lfwjrg --no-tail \
            | grep -viE 'account-deletion|GET (/|/api/health|/assets|/media|/favicon)|\.php|New SSH session' \
            | grep -iE 'error|warn|exception|traceback|critical|" 5[0-9][0-9] |ENOSPC|No space' \
            | tail -150 || echo "(no error/warning lines in the retained window)"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # Compact tail so a reader only needs the LAST few lines of this job:
      # storage config, disk headroom, app health.
      - name: SUMMARY
        run: |
          echo "===== SUMMARY ====="
          echo -n 'storage secrets: '
          flyctl secrets list -a listing-lfwjrg 2>/dev/null | awk 'NR>1 {printf "%s ", $1}' | tr ' ' '\n' | grep -E '^(R2_|PIXIAN|PHOTOROOM|ADOBE)' | paste -sd' ' - || echo none
          flyctl ssh console -a listing-lfwjrg -C "df -h /data" 2>/dev/null | tail -1 || true
          flyctl ssh console -a listing-lfwjrg -C "du -sh /data/sessions /data/exports" 2>/dev/null | tail -2 || true
          flyctl ssh console -a listing-lfwjrg -C "du -sh /data/* 2>/dev/null | sort -h | tail -5" 2>/dev/null | tail -5 || true
          echo "--- WHAT COMMIT IS ACTUALLY RUNNING ---"
          curl -sS https://listing-lfwjrg.fly.dev/api/health | tr ',' '\n' \
            | grep -E '"build"' || echo 'NO build FIELD -> image predates the build stamp (#183)'
          curl -sS https://listing-lfwjrg.fly.dev/api/ebay/status | tr ',' '\n' \
            | grep -E 'unowned_listings|foreign_listings' \
            || echo 'NO foreign/unowned fields -> image predates #176'
          curl -sS https://listing-lfwjrg.fly.dev/api/health | tr ',' '\n' | grep -E 'objstore|disk_free' || true
          echo "===== END ====="
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
