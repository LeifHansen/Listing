name: Verify Adobe config
# Ops helper (manual only): checks that the Adobe pipeline's configuration is
# actually in place on the production app — WITHOUT exposing any secret
# values. Lists Fly secret NAMES (+ digests), the app's /api/health, and any
# Adobe-related boot warnings in recent logs. Safe to run anytime; remove
# once the Adobe pipeline is verified live.
on:
  workflow_dispatch:

jobs:
  verify:
    name: Secret names + health + logs
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Fly secret names (values are never shown)
        run: flyctl secrets list -a listing-lfwjrg
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Health endpoint
        run: |
          curl -sS --max-time 30 https://listing-lfwjrg.fly.dev/api/health || true
          echo
      - name: Adobe-related lines in recent logs
        run: |
          flyctl logs -a listing-lfwjrg --no-tail | grep -i -E "adobe|lightroom|photoroom|r2|objstore" | tail -40 || echo "(no matching log lines)"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
