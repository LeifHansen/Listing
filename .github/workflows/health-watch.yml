name: Health watch

# The alarm for a system with no telemetry. /api/ready and /api/health already
# report everything needed to see trouble coming -- readiness returns 503 below
# READY_MIN_DISK_MB, health reports disk_free_mb, objstore_error and db state --
# but nothing ever calls them. fly-logs.yml curls both and is
# workflow_dispatch-only, so it runs when a human remembers, which is never
# before an incident. On 2026-08-10 the volume sat at 61% with the reclaim
# daemon in aggressive mode, and that was visible only to someone going to look.
#
# A failed scheduled run emails and push-notifies through the GitHub mobile
# app -- a channel this project's operator demonstrably watches, since PRs get
# merged from it.
#
# Deliberately needs no FLY_API_TOKEN: both endpoints are public, so this
# workflow cannot leak a credential and keeps working across a token rotation.
#
# NOT in the fly-deploy concurrency group on purpose. fly-logs.yml shares that
# group so a log dump cannot interleave with a deploy; a read-only probe has no
# such conflict and must never be able to hold a deploy up.
on:
  schedule:
    - cron: '17 */2 * * *'   # every 2 hours, off the hour to dodge the rush
  workflow_dispatch:

env:
  SITE: https://listing-lfwjrg.fly.dev
  # Warn ABOVE main.py's _LOW_DISK_BYTES (250MB) so this fires while reclaim is
  # still coping, rather than after it has gone desperate.
  MIN_FREE_MB: '400'

jobs:
  probe:
    name: Probe readiness and disk headroom
    runs-on: ubuntu-latest
    steps:
      # Required: the threshold logic below lives in the repo. Without this the
      # job runs in an empty workspace and fails on every schedule, which turns
      # the alarm into noise that trains the operator to ignore it.
      # fetch-depth: the build-drift step below needs recent history to decide
      # whether the commit production reports is one of ours.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 50

      - name: Readiness (503 = not serving)
        run: |
          # Retried, because min_machines_running = 1 means a deploy replaces
          # the ONLY machine: a probe landing in that window sees a refused
          # connection or a 503 from a perfectly healthy deploy. fly-logs.yml
          # loops its live-site check for the same reason. Only a reading that
          # stays bad across all attempts is real.
          code=000
          for i in 1 2 3; do
            code=$(curl -sS -m 20 -o /tmp/ready.json -w '%{http_code}' "$SITE/api/ready" || echo 000)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && break
            [ "$i" != "3" ] && sleep 20
          done
          tr ',' '\n' < /tmp/ready.json 2>/dev/null || true
          if [ "$code" != "200" ]; then
            echo "::error::/api/ready returned $code on 3 attempts - the app cannot do photo work right now"
            exit 1
          fi

      - name: Disk headroom, storage and database
        # always(): when readiness fails is exactly when the diagnosis matters.
        # Without this the operator gets "/api/ready returned 503" and nothing
        # about disk, storage or the database to explain it.
        if: always()
        run: |
          code=$(curl -sS -m 20 -o /tmp/health.json -w '%{http_code}' "$SITE/api/health" || echo 000)
          echo "HTTP $code"
          cat /tmp/health.json 2>/dev/null | tr ',' '\n' || true
          if [ "$code" != "200" ]; then
            echo "::error::/api/health returned $code - the app is not answering"
            exit 1
          fi
          python3 .github/scripts/check_health.py /tmp/health.json "$MIN_FREE_MB"

      - name: Build drift (is production running what we shipped?)
        # always(): a machine serving old code often looks perfectly healthy,
        # which is the whole problem -- readiness and disk both pass while the
        # app is weeks behind.
        if: always()
        run: |
          # On 2026-08-27 production spent 14 hours back on a pre-Aug-24 image.
          # Every check was green, the deploy that put the current code there
          # had verified itself, and nothing anywhere was watching the one
          # signal that would have caught it: WHICH COMMIT is answering. It was
          # found only because a seller reported the same bug twice.
          #
          # The deploy workflow verifies the build at deploy time. That proves
          # the code arrived; it cannot prove it stayed. A release made outside
          # CI -- a `fly deploy` from a checkout that is behind, a rollback, a
          # machine recreated from an older release -- silently replaces it, and
          # until this step existed nothing said so.
          build=$(curl -sS -m 20 "$SITE/api/health" \
            | python3 -c 'import json,sys;print((json.load(sys.stdin).get("build") or "").strip())' \
            2>/dev/null || echo '')
          echo "production build: ${build:-<none>}"
          echo "main HEAD:        $(git rev-parse HEAD)"
          if [ -z "$build" ]; then
            echo "::error::/api/health reports no build commit at all. The image predates the build stamp, so production is running code from before 2026-08-26 regardless of what the last deploy said."
            exit 1
          fi
          # Not "equals HEAD": a deploy can legitimately be in flight, and the
          # schedule must not cry wolf for the few minutes that takes. Being
          # anywhere in recent main is the honest bar -- it still catches the
          # case that matters, an image from outside this history entirely.
          if git merge-base --is-ancestor "$build" HEAD 2>/dev/null \
             && [ "$(git rev-list --count "$build".."HEAD")" -le 20 ]; then
            echo "OK: production is running $build, within the last 20 commits of main."
          else
            echo "::error::Production is running $build, which is not a recent commit on main. Something deployed over CI -- run 'fly releases -a listing-lfwjrg' and look for a release with no matching Actions run."
            exit 1
          fi
