name: CI

# Pre-merge signal for a solo operator who merges from a phone: lint + the
# pure-unit test suite (config/storage/objstore naming, plus the pure-Pillow
# mask/framing helpers in services/images — the code whose misbehavior has
# actually bitten production). Deliberately does NOT install the heavy model
# stack (rembg/onnxruntime); the image tests run no inference. Pillow and
# anthropic are here only so backend.services.images imports.
on:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install ruff pytest python-dotenv pydantic boto3 Pillow anthropic
      - name: Ruff
        run: ruff check backend
      - name: Tests
        run: pytest backend/tests -q
