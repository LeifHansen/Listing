name: CI

# Pre-merge signal for a solo operator who merges from a phone: lint + the
# pure-unit test suite (config/storage/objstore naming, and the token billing
# engine — the modules whose misconfiguration has actually bitten production
# or would bite revenue). Deliberately does NOT install the heavy image
# stack; these tests never import main/images. SQLAlchemy + httpx are here
# for the token tests (billing invariants run against SQLite).
on:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Just what the unit tests import — deliberately not the heavy image
      # stack (rembg/onnxruntime/Pillow), which these tests never touch.
      # fastapi is here because backend/auth.py imports it for Request/Response.
      - name: Install
        run: pip install ruff pytest python-dotenv pydantic boto3 SQLAlchemy bcrypt PyJWT fastapi httpx
      - name: Ruff
        run: ruff check backend
      - name: Tests
        run: pytest backend/tests -q

  # The image gate. The fast job above deliberately skips the image stack, so
  # the rules that decide whether a cutout deleted the product would run
  # nowhere — and "the background remover ate my item" is the failure that
  # actually reaches sellers. Pillow/NumPy/SciPy only: no rembg, no
  # onnxruntime, no model download. The suite works on synthetic mattes with
  # known ground truth, which is what makes that possible.
  cutout:
    name: Cutout safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install pytest pillow numpy scipy python-dotenv pydantic
      - name: Mask-safety rules
        run: pytest backend/tests/test_matte.py -q
      - name: Cutout regression suite
        run: pytest backend/tests/test_cutout_regression.py backend/tests/test_bg_border.py -q

  # The Vite build is the only thing that type-checks the JSX. Without it a
  # broken import or syntax error in the frontend only surfaced during the
  # production Docker build, i.e. after merge.
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
