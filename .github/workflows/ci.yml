name: CI

# Pre-merge signal. The gates themselves live in gates.yml, which deploy.yml
# calls too — so what runs before a merge and what runs before production is
# the same definition rather than two copies that drift.

on:
  pull_request:
  workflow_dispatch:


# The default GITHUB_TOKEN is read-only on this repository's contents and
# nothing here needs more (the deploys authenticate to Fly with their own
# token). Written down so a future job that DOES need more has to say so.
permissions:
  contents: read
jobs:
  gates:
    name: Gates
    uses: ./.github/workflows/gates.yml
