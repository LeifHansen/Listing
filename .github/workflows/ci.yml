name: CI

# Pre-merge signal for a solo operator who merges from a phone: lint + the
# pure-unit test suite (config/storage/objstore naming, and the token billing
# engine — the modules whose misconfiguration has actually bitten production
# or would bite revenue). Deliberately does NOT install the heavy image
# stack; these tests never import main/images. SQLAlchemy + httpx are here
# for the token tests (billing invariants run against SQLite).
on:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Just what the unit tests import — deliberately not the heavy image
      # stack (rembg/onnxruntime/Pillow), which these tests never touch.
      # fastapi is here because backend/auth.py imports it for Request/Response.
      - name: Install
        run: pip install ruff pytest python-dotenv pydantic boto3 SQLAlchemy bcrypt PyJWT fastapi httpx
      - name: Ruff
        run: ruff check backend
      - name: Tests
        run: pytest backend/tests -q

  # The image gate. The fast job above deliberately skips the image stack, so
  # the rules that decide whether a cutout deleted the product would run
  # nowhere — and "the background remover ate my item" is the failure that
  # actually reaches sellers. Pillow/NumPy/SciPy only: no rembg, no
  # onnxruntime, no model download. The suite works on synthetic mattes with
  # known ground truth, which is what makes that possible.
  cutout:
    name: Cutout safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install pytest pillow numpy scipy python-dotenv pydantic
      - name: Mask-safety rules
        run: pytest backend/tests/test_matte.py -q
      - name: Cutout regression suite
        run: pytest backend/tests/test_cutout_regression.py backend/tests/test_bg_border.py -q
      - name: Export contract
        run: pytest backend/tests/test_export_pipeline.py backend/tests/test_orientation.py -q

  # The Vite build is the only thing that type-checks the JSX. Without it a
  # broken import or syntax error in the frontend only surfaced during the
  # production Docker build, i.e. after merge.
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Unit tests
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  # Boots the real app and clicks through every screen. The unit tests and the
  # build both pass happily on a UI that throws on mount — this is the job that
  # catches a screen a seller cannot open.
  smoke:
    name: App smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
      - name: Browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      # Installed FROM requirements.txt, minus only the two packages the app
      # imports lazily (rembg pulls onnxruntime and a ~176MB model). A
      # hand-written second list is what put this job in a loop: it was missing
      # anthropic, then python-multipart, each found one CI run at a time.
      # Deriving it from the real file means a new dependency cannot drift out
      # of sync with what the app actually needs to boot.
      - name: Server deps
        run: |
          grep -vE '^(rembg|onnxruntime)' requirements.txt > /tmp/ci-reqs.txt
          pip install -r /tmp/ci-reqs.txt pytest
      # This is the only job with fastapi AND Pillow together, so it is the
      # only place these can run at all. In `checks` they importorskip on the
      # missing Pillow and in `cutout` there is no fastapi — which meant they
      # were passing by never executing.
      - name: API tests
        run: pytest backend/tests/test_readiness.py backend/tests/test_image_order.py -q
      - name: Boot
        run: |
          SECRET_KEY=ci-smoke nohup python -m uvicorn backend.main:app --port 8099 \
            > /tmp/server.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8099/api/health >/dev/null && exit 0
            sleep 1
          done
          echo "server never became healthy:" >&2; cat /tmp/server.log >&2; exit 1
      - name: Smoke
        run: npm run smoke
        working-directory: frontend
      - name: Server log on failure
        if: failure()
        run: cat /tmp/server.log || true
