name: Gates

# The single definition of "has this commit been checked", called by BOTH
# ci.yml (on a pull request) and deploy.yml (before shipping to Fly).
#
# It exists because those two were separate copies of the same intent and had
# already drifted: deploy.yml gated production on the lightweight lint + unit
# job ALONE. The cutout-safety suite (which decides whether the background
# remover ate the seller's product), the frontend build (the only thing that
# type-checks the JSX) and the smoke test (the only thing that catches a
# screen a seller cannot open) never gated a deploy at all — and because
# ci.yml triggers only on `pull_request`, a direct push to main or a manual
# dispatch ran none of them either.
#
# deploy.yml's own comment already warned that its install list had to be kept
# in sync with ci.yml's "by hand"; one workflow means there is nothing to keep
# in sync.

on:
  workflow_call:


# The default GITHUB_TOKEN is read-only on this repository's contents and
# nothing here needs more (the deploys authenticate to Fly with their own
# token). Written down so a future job that DOES need more has to say so.
permissions:
  contents: read
# Every third-party action is pinned to a commit SHA, with the release it came
# from in the comment beside it. A tag is a mutable pointer the action's owner
# can move, so `@v4` means "whatever that account publishes next", running in
# a job that can read this repo's secrets. .github/dependabot.yml keeps the
# pins current: it reads those comments and opens a pull request when a newer
# release exists, so the pin buys review rather than staleness.

jobs:
  # Lint + the pure-unit suite: the fast half of the signal, ~35 seconds.
  # Deliberately does NOT install the heavy image stack, so anything needing
  # it importorskips here -- two thirds of the files do -- and runs in `smoke`
  # below, which now runs the WHOLE directory and fails on a skip, so a test
  # cannot quietly stop running by being left off a list.
  #
  # What this job proves on its own is that the modules with no heavy
  # dependencies really have none: services/listing_prompt.py and
  # services/barcodes.py hold rules (the prompt text; whether a barcode's
  # check digit lets it reach a listing) that must stay testable without the
  # SDK installed, and an import creeping into either would fail here.
  #
  # cryptography is not optional despite the name: backend/db.py imports
  # backend/crypto.py at module scope, so without it every test that touches
  # the DB fails at COLLECTION.
  checks:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install
        run: pip install ruff pytest python-dotenv pydantic boto3 SQLAlchemy bcrypt PyJWT fastapi httpx cryptography alembic
      - name: Ruff
        run: ruff check backend
      - name: Tests
        run: pytest backend/tests -q

  # The image gate, and it is about a DEPENDENCY PROFILE rather than about
  # coverage: `smoke` below runs every test in the suite, this one included,
  # so nothing here would go unrun without it. What it proves that `smoke`
  # cannot is that the pass deciding what a seller's photo looks like on eBay
  # -- as shot or cut out, upright, no EXIF, resumable -- works on PILLOW
  # ALONE: no rembg, no onnxruntime, no model download, no Anthropic SDK,
  # with the cutout model stood in for by a matte the tests draw themselves
  # and the orientation model by canned answers. It is also ten seconds, so
  # a broken photo pass says so before the four-minute job gets there.
  #
  # Its list of files is therefore a deliberate narrowing, not the kind that
  # bit us in `smoke` -- see the note there. A new photo test left off this
  # list still runs (in `smoke`); it just is not additionally proved against
  # Pillow on its own.
  cutout:
    name: Cutout safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install
        run: pip install pytest pillow python-dotenv pydantic
      # Failing on a SKIP is the point. Every test here importorskips, because
      # the fast `checks` job collects the whole directory without the image
      # stack. That is also how a suite quietly stops running: the deps drift,
      # the file skips in the one job built for it, and green stops meaning
      # anything. This job asserts it actually ran.
      - name: The photo pass, the export contract, and resume
        shell: bash
        run: |
          set -o pipefail
          pytest backend/tests/test_the_photo_pass_does_three_things.py \
                 backend/tests/test_the_item_is_turned_upright_whatever_it_is.py \
                 backend/tests/test_export_pipeline.py \
                 backend/tests/test_a_transparent_photo_does_not_go_black.py \
                 backend/tests/test_photo_resume.py \
                 backend/tests/test_the_cutout_does_not_eat_the_artwork.py \
                 backend/tests/test_the_cutout_does_not_leave_a_ghost.py \
                 backend/tests/test_a_close_up_of_a_tag_keeps_its_background.py \
                 -q -rs | tee /tmp/photo-pass.log
          if grep -qE '[0-9]+ skipped' /tmp/photo-pass.log; then
            echo "::error::a photo-pass suite skipped in the job built to run it"
            exit 1
          fi

  # The Vite build is the only thing that type-checks the JSX. Without it a
  # broken import or syntax error in the frontend only surfaced during the
  # production Docker build, i.e. after merge.
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Unit tests
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  # Boots the real app and clicks through every screen. The unit tests and the
  # build both pass happily on a UI that throws on mount — this is the job that
  # catches a screen a seller cannot open.
  smoke:
    name: App smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
      - name: Browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      # Runs against the built dist with its own stubbed API, so it needs the
      # browser above but not the server below. It answers the one question a
      # unit test cannot: is the editor's publish button actually under the
      # seller's finger, or under the toast that a failed publish just put
      # there. That collision shipped, and looked exactly like a dead button.
      - name: Publish bar is reachable
        run: npm run reach
        working-directory: frontend
      # Installed FROM requirements.txt, minus only the two packages the app
      # imports lazily (rembg pulls onnxruntime and a ~176MB model). A
      # hand-written second list is what put this job in a loop: it was missing
      # anthropic, then python-multipart, each found one CI run at a time.
      # Deriving it from the real file means a new dependency cannot drift out
      # of sync with what the app actually needs to boot.
      - name: Server deps
        run: |
          grep -vE '^(rembg|onnxruntime)' requirements.txt > /tmp/ci-reqs.txt
          pip install -r /tmp/ci-reqs.txt pytest
      # THE WHOLE SUITE, against the dependencies the app actually ships with.
      #
      # This is the only job with fastapi AND Pillow AND anthropic together,
      # so it is the only place a test that importorskips any of them can run
      # at all: in `checks` they skip on the missing stack, and in `cutout`
      # there is no fastapi. Two thirds of this suite's files importorskip
      # something.
      #
      # It used to name them one by one, and the list is what made green stop
      # meaning anything. 44 test files — a fifth of the suite — appeared in
      # no job's list, so they executed NOWHERE: they skipped in `checks`,
      # were absent here, and reported nothing at all. That is not a
      # hypothetical. #250 changed pricing.suggest()'s signature, the doubles
      # in one of those 44 files went stale, every comp lookup started raising
      # TypeError — which the caller swallows as "eBay is down", so drafts
      # would silently have stopped being price-checked — and all four gates
      # went green over it. The file was added to the list by hand afterwards,
      # which fixes that one file and leaves the mechanism intact.
      #
      # So there is no list. The directory is the list, exactly as the deps
      # above are requirements.txt rather than a second hand-written copy of
      # it — the same lesson, one step later. A test file cannot be forgotten
      # here, because nobody has to remember it.
      #
      # ~2500 tests, about two and a half minutes.
      - name: The whole backend suite
        shell: bash
        run: |
          set -o pipefail
          pytest backend/tests \
                 -q -rs | tee /tmp/api-tests.log
          # NOTHING may skip here, and that is the whole guarantee. This job
          # has every dependency the app has, so a skip means a test decided
          # it could not run in the one place built to run it — which is
          # indistinguishable, in the green tick, from a test that passed.
          # -rs above prints the reason for each, so a failure says which
          # test and why rather than only that the count was not zero.
          #
          # If a test ever genuinely cannot run in CI (it wants rembg, say,
          # which is the one thing deliberately left out of the deps above),
          # do NOT let it skip: mark it and DESELECT it here with
          # `-m "not <marker>"`. Deselecting is visible in this file and
          # keeps this guard meaning what it says; skipping hides the
          # exclusion inside the test and buys back the whole problem.
          if grep -qE '[0-9]+ skipped' /tmp/api-tests.log; then
            echo "::error::A test skipped in the only job that can run it — see the reasons above. Fix the test or deselect it explicitly (see the note in gates.yml); never leave it skipping here."
            exit 1
          fi
      # A database, because half the smoke test is a seller signing up: with
      # no DATABASE_URL the app refuses accounts, and the signed-in journey --
      # the only pass that makes the app actually fetch anything -- cannot
      # run. SQLite in a temp file, thrown away with the runner.
      - name: Boot
        run: |
          SECRET_KEY=ci-smoke DATABASE_URL="sqlite:////tmp/smoke.db" \
            nohup python -m uvicorn backend.main:app --port 8099 \
            > /tmp/server.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8099/api/health >/dev/null && exit 0
            sleep 1
          done
          echo "server never became healthy:" >&2; cat /tmp/server.log >&2; exit 1
      - name: Smoke
        run: npm run smoke
        working-directory: frontend
      - name: Server log on failure
        if: failure()
        run: cat /tmp/server.log || true
