# Lint contract for CI and local runs. Pinning the ruleset (rather than a
# ruff version) keeps `ruff check backend` meaning the same thing on any
# machine: pyflakes + the core pycodestyle errors. The wider stylistic rule
# families (UP/S/I/RUF...) are deliberately not enabled — retrofitting them
# onto this codebase would bury real findings in churn.
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F"]
