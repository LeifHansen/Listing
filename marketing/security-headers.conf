# Sent on every response. `always` matters — without it nginx omits these on
# error responses, which is exactly when a missing X-Frame-Options counts.
#
# The CSP mirrors the posture of the app's own builder (backend/main.py,
# build_csp): default-deny, with only the origins this site genuinely uses.
# Google Fonts is the one third-party dependency — the stylesheet comes from
# fonts.googleapis.com and the font files from fonts.gstatic.com. The HubSpot
# origins are there for the notify-me form's configurable endpoint; drop them
# if PUBLIC_SIGNUP_ENDPOINT points somewhere else, and add whatever it does
# point at.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://*.hubspot.com https://*.hsforms.com; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self' https://*.hubspot.com https://*.hsforms.com; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
