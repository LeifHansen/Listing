# Static server for the marketing site.
#
# Two things this file is responsible for that a managed static host would
# have done for us: mapping clean URLs onto the .html files Astro emits, and
# sending the security headers that used to live in a _headers file.

server {
  listen 8080;
  listen [::]:8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Astro's `build.format: "file"` emits /pricing.html, and every canonical
  # URL, sitemap entry and internal link says /pricing. Without the $uri.html
  # fallback below, every page on the site 404s.
  #
  # `=404` rather than a fallback to /404.html, because falling back would
  # serve the not-found page with a 200 and tell crawlers a missing URL is a
  # real one. error_page turns the real 404 into the branded page.
  location / {
    try_files $uri $uri.html $uri/index.html =404;
    # HTML must revalidate so a deploy is visible immediately. This has to be
    # set HERE and not only in the .html location below: try_files resolves
    # /pricing to /pricing.html by internal redirect, and add_header is decided
    # by the location that matched the ORIGINAL request — which for every clean
    # URL on this site is this one. Without it, pages ship with no
    # Cache-Control at all and get heuristically cached.
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # www and the apex must not both serve the site. Every canonical URL on this
  # site names the apex, so www is a permanent redirect rather than a second
  # copy competing with it in search. `if` + `return` is the documented-safe
  # use of `if` here.
  if ($host ~* ^www\.(.+)$) {
    return 301 https://$1$request_uri;
  }

  # /pricing/ and /pricing must not both be live URLs. The rewrite requires at
  # least one character before the slash, so it cannot match "/" itself.
  rewrite ^/(.+)/$ /$1 permanent;

  # Hashed filenames change whenever the bytes do, so these can be cached
  # forever. add_header does NOT inherit into a location that sets its own,
  # hence the include here too.
  location /_astro/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Apple fetches this with no file extension; it must be served as JSON.
  location = /.well-known/apple-app-site-association {
    default_type application/json;
    include /etc/nginx/snippets/security-headers.conf;
  }

  # HTML must revalidate so a deploy is visible immediately.
  location ~* \.html$ {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    include /etc/nginx/snippets/security-headers.conf;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
    include /etc/nginx/snippets/security-headers.conf;
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/xml application/rss+xml;

  # Fly terminates TLS in front of this, so the real client IP arrives here in
  # a header rather than on the connection.
  real_ip_header X-Forwarded-For;
  set_real_ip_from 0.0.0.0/0;

  server_tokens off;
}
