<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Thryft Shop — AI eBay listings</title>
  <meta name="description" content="Snap it. AI writes it. List it on eBay." />
  <link rel="icon" type="image/png" href="/thryft-shop-logo-final.png" />
  <link rel="apple-touch-icon" href="/thryft-shop-logo-final.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Fredoka (600-700) sets headings, stats & short labels; Nunito Sans
       (400-700) carries navigation, buttons and body copy. -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    // Apply the saved theme before first paint to avoid a light-mode flash.
    try {
      const t = localStorage.getItem("quickflip-theme");
      if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.classList.add("dark");
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root">
    <!-- Branded boot splash — replaced the moment React mounts. -->
    <div id="boot-splash" style="min-height:100dvh;display:grid;place-items:center">
      <img src="/thryft-shop-logo-final.png" alt="Thryft Shop"
        style="width:200px;max-width:60vw;border-radius:28px;animation:ts-boot 1.6s ease-in-out infinite" />
    </div>
    <style>
      @keyframes ts-boot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(.97)}}
      @media (prefers-reduced-motion: reduce){#boot-splash img{animation:none}}
    </style>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
