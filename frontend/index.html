<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Thryft Shop — AI eBay listings</title>
  <meta name="description" content="Snap it. AI writes it. List it on eBay." />
  <!-- Sized for the slot each one fills. These used to be the 574KB master
       art: a 1254px PNG for a 32px favicon, and again for the boot splash,
       which is fetched BEFORE React mounts -- so the branded splash sat blank
       for as long as it took, on the cellular connection this ships to. -->
  <link rel="icon" type="image/png" sizes="48x48" href="/logo-48.png" />
  <link rel="apple-touch-icon" href="/logo-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Fredoka (600-700) sets headings, stats & short labels; Nunito Sans
       (400-700) carries navigation, buttons and body copy. -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    // Apply the saved theme before first paint to avoid a light-mode flash.
    // This runs before the bundle exists, so it cannot call readLocal() -- it
    // repeats that new-key-then-legacy-key read by hand, and src/lib/
    // localPrefs.js has to keep matching it (src/theme-before-paint.test.js
    // asserts they do). It is also the ONLY reader of the stored theme: the
    // store seeds its state from the class set here, so a key this misses is
    // a preference the whole app misses, not just a flash. No migration
    // write -- a legacy key is carried forward by the next theme toggle.
    try {
      const t = localStorage.getItem("thryft-theme")
        || localStorage.getItem("quickflip-theme");
      if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.classList.add("dark");
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div id="root">
    <!-- Branded boot splash — replaced the moment React mounts. -->
    <div id="boot-splash" style="min-height:100dvh;display:grid;place-items:center">
      <img src="/logo-512.webp" alt="Thryft Shop" width="512" height="512"
        style="width:200px;max-width:60vw;border-radius:28px;animation:ts-boot 1.6s ease-in-out infinite" />
    </div>
    <style>
      @keyframes ts-boot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(.97)}}
      @media (prefers-reduced-motion: reduce){#boot-splash img{animation:none}}
    </style>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
